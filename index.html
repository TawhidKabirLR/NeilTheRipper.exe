<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Password Cracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 580px;
    margin: 60px auto;
    padding: 0 20px;
    background: #0f0f10;
    color: #e8e8e8;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #888; margin: 0 0 24px; font-size: 13px; }
  label { display: block; margin: 14px 0 6px; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select, button {
    width: 100%;
    padding: 10px 12px;
    background: #1a1a1c;
    color: #e8e8e8;
    border: 1px solid #2a2a2e;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  input[type=file] { padding: 8px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  button {
    background: #3b82f6;
    border: none;
    cursor: pointer;
    font-weight: 600;
    margin-top: 24px;
    transition: background 0.15s;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #2a2a2e; color: #666; cursor: not-allowed; }
  #status {
    margin-top: 20px;
    padding: 14px;
    background: #1a1a1c;
    border: 1px solid #2a2a2e;
    border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    min-height: 92px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .found { color: #10b981; font-weight: 600; font-size: 15px; }
  .err { color: #ef4444; }
  .progress {
    height: 4px;
    background: #2a2a2e;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress > div {
    height: 100%;
    background: #3b82f6;
    width: 0;
    transition: width 0.2s;
  }
  footer {
    margin-top: 40px;
    color: #555;
    font-size: 11px;
    text-align: center;
  }
  footer a { color: #777; }
</style>
</head>
<body>

<h1>PDF Password Cracker</h1>
<p class="sub">Runs entirely in your browser. The PDF never leaves your machine.</p>

<label for="file">PDF file</label>
<input type="file" id="file" accept="application/pdf">

<label for="charset">Character set</label>
<select id="charset">
  <option value="digits" selected>Digits only (0-9)</option>
  <option value="lower">Lowercase letters (a-z)</option>
  <option value="upper">Uppercase letters (A-Z)</option>
  <option value="alpha">Letters (a-z, A-Z)</option>
  <option value="alphanum">Letters + digits</option>
  <option value="custom">Custom...</option>
</select>

<div id="customWrap" style="display:none">
  <label for="customChars">Custom characters</label>
  <input type="text" id="customChars" placeholder="e.g. 0123456789abcdef">
</div>

<div class="row">
  <div>
    <label for="length">Length</label>
    <input type="number" id="length" value="6" min="1" max="10">
  </div>
  <div>
    <label for="workerCount">Workers</label>
    <input type="number" id="workerCount" value="8" min="1" max="32">
  </div>
</div>

<button id="go" disabled>Start cracking</button>
<button id="stop" style="display:none; background:#ef4444; margin-top:8px">Stop</button>

<div id="status">Pick a PDF to begin.</div>
<div class="progress"><div id="bar"></div></div>

<footer>
  All processing is local. No upload, no tracking.
  Powered by <a href="https://mozilla.github.io/pdf.js/" target="_blank" rel="noopener">PDF.js</a>.
</footer>

<script>
const CHARSETS = {
  digits:   "0123456789",
  lower:    "abcdefghijklmnopqrstuvwxyz",
  upper:    "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
  alpha:    "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ",
  alphanum: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
};

const $ = id => document.getElementById(id);
let pdfBytes = null;
let workers = [];

document.getElementById("workerCount").value = Math.min(16, Math.max(2, navigator.hardwareConcurrency || 4));

$("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  pdfBytes = new Uint8Array(await f.arrayBuffer());
  $("status").textContent = `Loaded: ${f.name} (${(f.size/1024).toFixed(1)} KB)`;
  $("go").disabled = false;
});

$("charset").addEventListener("change", e => {
  $("customWrap").style.display = e.target.value === "custom" ? "block" : "none";
});

const WORKER_CODE = `
importScripts('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
const pdfjsLib = self.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = '';

let abort = false;

self.onmessage = async (e) => {
  if (e.data.type === 'abort') { abort = true; return; }
  if (e.data.type !== 'work') return;

  const { pdfBuffer, charset, length, startIdx, endIdx } = e.data;
  const bytes = new Uint8Array(pdfBuffer);
  const n = charset.length;
  let local = 0;

  for (let i = startIdx; i < endIdx; i++) {
    if (abort) { self.postMessage({ type: 'done' }); return; }

    let pw = '';
    let v = i;
    for (let k = 0; k < length; k++) {
      pw = charset[v % n] + pw;
      v = (v / n) | 0;
    }

    try {
      const task = pdfjsLib.getDocument({
        data: bytes.slice(),
        password: pw,
        verbosity: 0,
        disableWorker: true,
        useWorkerFetch: false,
        isEvalSupported: false,
      });
      const doc = await task.promise;
      doc.destroy();
      self.postMessage({ type: 'found', pw });
      return;
    } catch (err) {}

    local++;
    if (local >= 10) {
      self.postMessage({ type: 'progress', count: local, current: pw });
      local = 0;
    }
  }

  if (local > 0) self.postMessage({ type: 'progress', count: local });
  self.postMessage({ type: 'done' });
};
`;

function stopWorkers() {
  for (const w of workers) {
    try { w.postMessage({ type: 'abort' }); w.terminate(); } catch {}
  }
  workers = [];
}

$("stop").addEventListener("click", () => {
  stopWorkers();
  $("status").textContent += "\nStopped.";
  $("go").style.display = "block";
  $("stop").style.display = "none";
});

$("go").addEventListener("click", () => {
  if (!pdfBytes) return;
  let cs;
  if ($("charset").value === "custom") {
    cs = $("customChars").value;
    if (!cs) { $("status").innerHTML = '<span class="err">Enter custom characters.</span>'; return; }
  } else {
    cs = CHARSETS[$("charset").value];
  }
  const length = +$("length").value;
  const N = Math.max(1, +$("workerCount").value);
  const total = Math.pow(cs.length, length);

  $("go").style.display = "none";
  $("stop").style.display = "block";
  $("bar").style.width = "0";

  const blob = new Blob([WORKER_CODE], { type: 'application/javascript' });
  const workerUrl = URL.createObjectURL(blob);

  const chunkSize = Math.ceil(total / N);
  const start = performance.now();
  let totalTried = 0;
  let doneCount = 0;
  let lastCurrent = '';
  let foundPw = null;

  for (let i = 0; i < N; i++) {
    const w = new Worker(workerUrl);
    w.onmessage = (e) => {
      const m = e.data;
      if (m.type === 'progress') {
        totalTried += m.count;
        if (m.current) lastCurrent = m.current;
      } else if (m.type === 'found') {
        foundPw = m.pw;
        const secs = (performance.now() - start) / 1000;
        $("status").innerHTML =
          `<span class="found">FOUND: ${foundPw}</span>\n` +
          `Cracked in ${secs.toFixed(1)}s using ${N} workers ` +
          `(~${(totalTried/secs).toFixed(0)}/s aggregate)`;
        $("bar").style.width = "100%";
        stopWorkers();
        $("go").style.display = "block";
        $("stop").style.display = "none";
      } else if (m.type === 'done') {
        doneCount++;
        if (doneCount === N && !foundPw) {
          $("status").textContent = `Exhausted ${total.toLocaleString()} passwords. No match.`;
          $("go").style.display = "block";
          $("stop").style.display = "none";
        }
      }
    };
    w.onerror = (err) => {
      $("status").innerHTML = '<span class="err">Worker error: ' + err.message + '</span>';
    };
    w.postMessage({
      type: 'work',
      pdfBuffer: pdfBytes.buffer.slice(),
      charset: cs,
      length: length,
      startIdx: i * chunkSize,
      endIdx: Math.min((i + 1) * chunkSize, total),
    });
    workers.push(w);
  }

  // Status updater
  const ticker = setInterval(() => {
    if (foundPw || workers.length === 0) { clearInterval(ticker); return; }
    const secs = (performance.now() - start) / 1000;
    const rate = totalTried / secs;
    const eta = rate > 0 ? (total - totalTried) / rate : Infinity;
    $("status").textContent =
      `Last tried: ${lastCurrent || '...'}\n` +
      `${totalTried.toLocaleString()} / ${total.toLocaleString()}  ` +
      `(${rate.toFixed(0)}/s, ${N} workers)\n` +
      `ETA: ${formatTime(eta)}`;
    $("bar").style.width = (totalTried / total * 100) + "%";
  }, 500);
});

function formatTime(s) {
  if (!isFinite(s)) return "calculating...";
  if (s < 60) return s.toFixed(0) + "s";
  if (s < 3600) return Math.floor(s/60) + "m " + Math.floor(s%60) + "s";
  return Math.floor(s/3600) + "h " + Math.floor((s%3600)/60) + "m";
}
</script>
</body>
</html>
